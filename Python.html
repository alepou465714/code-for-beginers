<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run Python with PyScript</title>

    <!-- Load PyScript CSS and JS from official CDN -->
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css">
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
</head>
<body>

    <h1>PyScript Test</h1>

    <!-- This will show output below -->
    <py-script>
        print("Hello from Python in HTML!")
    </py-script>

</body>
</html>
