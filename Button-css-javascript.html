<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="1" onclick="next()">Hello</button>
</body>
<style>
    button{
        size: 40px;
        border-radius: 20px;
        border: solid 3px blue;
    }
</style>
<script>
    function next(){
        document.getElementById("1").innerHTML="1234";
    }
</script>
</html>
